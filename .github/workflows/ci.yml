name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch piece assets
        run: sh scripts/fetch-pieces.sh
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
