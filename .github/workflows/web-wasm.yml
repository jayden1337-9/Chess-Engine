name: WebAssembly Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --locked
      - name: Fetch piece assets
        run: sh scripts/fetch-pieces.sh
      - name: Build Rust WebAssembly app
        run: cargo build --release --lib --target wasm32-unknown-unknown
      - name: Generate browser WebAssembly bindings
        run: wasm-bindgen --target web --out-dir web/pkg target/wasm32-unknown-unknown/release/chess_engine.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: chess-engine-web-wasm
          path: web/pkg/
          if-no-files-found: error
