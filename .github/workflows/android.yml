name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Fetch piece assets
        run: sh scripts/fetch-pieces.sh
      - name: Build APK
        run: cargo apk build --release --target aarch64-linux-android
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-chess-android-arm64
          path: target/release/apk/*.apk
          if-no-files-found: error
