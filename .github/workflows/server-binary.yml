name: Rust Server Binary

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-binary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux server (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build server
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 8
        run: cargo build --manifest-path server/Cargo.toml --release --target x86_64-unknown-linux-gnu

      - name: Prepare binary
        run: |
          mkdir -p dist
          cp server/target/x86_64-unknown-linux-gnu/release/chess-engine-server dist/chess-engine-server
          chmod +x dist/chess-engine-server
          file dist/chess-engine-server
          ldd dist/chess-engine-server || true

      - name: Upload Wispbyte binary
        uses: actions/upload-artifact@v4
        with:
          name: chess-engine-server-linux-x86_64
          path: dist/chess-engine-server
          if-no-files-found: error
          retention-days: 30
