name: Rust Server Binary

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "src/**"
      - "assets/pieces/**"
      - "scripts/fetch-pieces.sh"
      - "web/**"
      - "Cargo.toml"
      - ".github/workflows/server-binary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux server (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --locked

      - name: Fetch chess piece assets
        run: sh scripts/fetch-pieces.sh

      - name: Build browser app
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          cargo build --release --lib --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir web/pkg target/wasm32-unknown-unknown/release/chess_engine.wasm

      - name: Build server with embedded browser app
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 8
        run: cargo build --manifest-path server/Cargo.toml --release --target x86_64-unknown-linux-gnu

      - name: Prepare binary
        run: |
          mkdir -p dist
          cp server/target/x86_64-unknown-linux-gnu/release/chess-engine-server dist/chess-engine-server
          chmod +x dist/chess-engine-server
          file dist/chess-engine-server
          ldd dist/chess-engine-server || true

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: chess-engine-server-linux-x86_64
          path: dist/chess-engine-server
          if-no-files-found: error
          retention-days: 30
