[package]
name = "chess-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "chess-engine"
path = "src/main.rs"

[dependencies]
chess = "3.2.0"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "android-native-activity", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
ewebsock = { version = "0.8", features = ["tls"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CssStyleDeclaration", "Node"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.android]
package = "com.chess.engine"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35

[package.metadata.android.application]
label = "Chess Engine"

[package.metadata.android.application.activity]
name = "android.app.NativeActivity"
